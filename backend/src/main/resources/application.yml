server:
  port: 8080

spring:
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/recruitdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    baseline-on-migrate: true

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

app:
  jwt:
    secret: ThisIsAVeryLongSecretKeyForJWTThatIsAtLeast64CharactersLongReplaceMeInProd
    expiration: 86400000
  aiservice:
    url: http://localhost:8001
  mail:
    from: recruit@example.com
