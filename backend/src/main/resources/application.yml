server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/recruitdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
        password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: your_mailtrap_username
    password: your_mailtrap_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ThisIsAVeryLongSecretKeyForJWTThatIsAtLeast64CharactersLongReplaceMeInProd
    expiration: 86400000
  aiservice:
    url: http://localhost:8001

logging:
  level:
    com.recruit: DEBUG
